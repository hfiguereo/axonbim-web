name: ci

# Independent verification of what an agent or a local run claims. Kept separate
# from e2e.yml so a browser failure and a type/unit failure are distinguishable.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # App toolchain (package.json engines >=22). Actions run on Node 24 runtime.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: No test shortcuts or type suppressions
        run: pnpm check:shortcuts

      - name: Documentation reachable from the AGENTS.md index
        run: pnpm check:docs

      - name: Domain and viewer layer purity
        run: pnpm check:layers

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test
        env:
          CI: true

      # Typecheck is not a build: bundling can fail on its own.
      - name: Production build
        run: pnpm build
